<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml" xmlns="http://www.w3.org/1999/html">
<head>
  <title>受講生詳細</title>
  <style>
    table {
    border-collapse: collapse;
    width: 100%;
    }
    th, td {
    border: 1px solid black;
    padding: 8px;
    text-align: left;
    }
  </style>
</head>
<body>
<h1>受講生詳細</h1>
<form th:action="@{'/updateStudent/' + ${studentDetail.student.id}}" th:object="${studentDetail}" method="post">
  <div>
    <label for="id">ID:</label>
    <input type="text" id="id" th:field="*{student.id}" required/>
  </div>
  <div>
    <label for="name">名前:</label>
    <input type="text" id="name" th:field="*{student.name}" required/>
  </div>
  <div>
    <label for="furigana">フリガナ:</label>
    <input type="text" id="furigana" th:field="*{student.furigana}" required/>
  </div>
  <div>
    <label for="nickname">ニックネーム:</label>
    <input type="text" id="nickname" th:field="*{student.nickname}" required/>
  </div>
  <div>
    <label for="emailAddress">メールアドレス:</label>
    <input type="text" id="emailAddress" th:field="*{student.emailAddress}" required/>
  </div>
  <div>
    <label for="area">地域:</label>
    <select id="area" th:field="*{student.area}"  required/>
    <option value="">選択してください</option>
    <option value="北海道">北海道</option>
    <option value="沖縄">沖縄</option>
    </select>
  </div>
  <div>
    <label for="age">年齢:</label>
    <input type="text" id="age" th:field="*{student.age}" required/>
  </div>
  <div>
    <label for="gender">性別:</label>
    <select id="gender" th:field="*{student.gender}" required/>
    <option value="">選択してください</option>
    <option value="男">男</option>
    <option value="女">女</option>
    <option value="その他">その他</option>
    </select>
  </div>
  <div>
    <label for="remark">備考欄:</label>
    <input type="text" id="remark" th:field="*{student.remark}" />
  </div>
  <div th:each="course, stat : *{studentCourses}">
    <label for="course_id" th:for="studentCourse.__${stat.index}__.id">受講コースID：</label>
    <input type="text" id="course_id" th:id="studentCourse.__${stat.index}__.id"
           th:field="*{studentCourses[__${stat.index}__].id}"/>

    <label for="courses" th:for="studentCourse.__${stat.index}__.courses">受講コース名：</label>
    <input type="text" id="courses" th:id="studentCourse.__${stat.index}__.courses"
           th:field="*{studentCourses[__${stat.index}__].courses}"/>
  </div>
  <div>
    <button type="submit">更新</button>
  </div>
</form>
</body>
</html>
